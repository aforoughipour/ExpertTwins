systemic immunology, which lies outside our core disease biology and risk-stratification scope."},{"t":3,"seat":"neuroblastoma","part":"Strongest evidence against our position on the choice of cytokine adjuvant","cause":"out_of_scope","detail":"We do not maintain a primary position on cytokine selection since clinical trial adjuvant comparison is outside our disease biology scope of work."},{"t":3,"seat":"neuroblastoma","part":"Weakest link in the causal claim regarding cytokine efficacy across eras and trials","cause":"insufficient_evidence","detail":"The retrieved literature contains no randomized clinical trials comparing anti-GD2 immunotherapy with and without specific cytokines while holding other induction and consolidation factors constant, preventing isolation of cytokine-specific effects."},{"t":3,"seat":"neuroblastoma","part":"Definitive recommendation and confidence level for the clinical regimen next week","cause":"insufficient_evidence","detail":"A clinical recommendation on specific adjuvant cytokines cannot be definitively made from our disease biology perspective due to the complete lack of head-to-head randomized trials."},{"t":3,"seat":"clinical_trials","part":"Whether G-CSF would match GM-CSF in a prospective randomized clinical trial in newly diagnosed high-risk neuroblastoma patients","cause":"insufficient_evidence","detail":"No head-to-head randomized trial exists comparing G-CSF to GM-CSF in any clinical setting in neuroblastoma. The [author] preclinical data are elegant and equipotency-suggesting, but my field (clinical trials evidence) does not yet have the trial data needed to recommend G-CSF in preference to GM-CSF based on efficacy."},{"t":3,"seat":"clinical_trials","part":"Whether complement-dependent cytotoxicity plays a causally superior role compared to ADCC in the anti-GD2 mechanism","cause":"underdetermined","detail":"The literature notes that an Fc mutation abolishing CDC does not reduce clinical efficacy, yet in vitro CDC is potent. This paradox is not resolved by my evidence. Both pathways likely contribute, but their relative contribution to clinical outcome in vivo is undetermined."},{"t":3,"seat":"pharmacology","part":"separable quantitative contribution of GM-CSF to survival in ANBL0032","cause":"insufficient_evidence","detail":"ANBL0032 tested a package (dinutuximab+GM-CSF+IL-2+isotretinoin); no trial isolates GM-CSF's individual effect"}],"themes":[{"id":0,"label":"High-risk GM-CSF regimen","hue":0,"n":14,"seats":["clinical_trials","immunology","neuroblastoma","pharmacology"],"exemplar":"For a child starting high-risk neuroblastoma therapy next week, the clinical evidence supports including GM-CSF with dinutuximab based on…"},{"id":1,"label":"Anti-GD2 package evidence","hue":90,"n":11,"seats":["clinical_trials","immunology","neuroblastoma"],"exemplar":"Neuroblastoma's claim that anti-GD2 monoclonal antibodies with GM-CSF produce higher overall survival than anti-GD2 without cytokines is…"},{"id":2,"label":"GM-CSF cytokine choice","hue":180,"n":25,"seats":["clinical_trials","immunology","neuroblastoma","pharmacology"],"exemplar":"A comprehensive review concluded that a substantial body of clinical data supports the combination of anti-GD2 monoclonal antibodies with…"},{"id":3,"label":"Myeloid effector cytokines","hue":270,"n":26,"seats":["clinical_trials","immunology","neuroblastoma","pharmacology"],"exemplar":"Dinutuximab beta, approved by the European Medicines Agency without GM-CSF, achieves 5-year survival outcomes that are not clearly inferior…"}],"ideas":[{"id":"I1.0.1","t":1,"theme":0,"members":["T1/immunology/C1","T1/neuroblastoma/C3","T1/clinical_trials/C1","T1/clinical_trials/C5","T1/clinical_trials/C7","T1/clinical_trials/C8","T1/pharmacology/C2"],"title":"A randomized phase III clinical trial led to FDA approval of dinutuximab in combination with GM-CSF, IL-2,…","medoid":"T1/pharmacology/C2","keywords":"high-risk · gm-csf il-2 · randomized","authors":["immunology","neurobla t":3,"theme":3,"members":["T3/clinical_trials/C1","T3/clinical_trials/C3","T3/clinical_trials/C4","T3/clinical_trials/C6","T3/pharmacology/C1"],"title":"The available evidence does not definitively distinguish GM-CSF from G-CSF as the optimal myeloid adjuvant","medoid":"T3/pharmacology/C1","keywords":"g-csf · gm-csf · adcc","authors":["clinical_trials","pharmacology"],"n_claims":5,"reception":{},"withdrawn_frac":0.0,"is_revision":false,"n_agree":0,"n_disagree":0,"grounded_frac":1.0,"n_docs":0,"merge":true,"split":false,"strength":0.294,"topic":"G-CSF as a possible GM-CSF alternative","gist":"Seats say G-CSF can match GM-CSF for neutrophil ADCC in studies, dinutuximab beta outcomes do not prove inferiority, and no clinical trial directly compares them.","x":1257.5,"y":749,"lx":1182,"ly":719.5}],"edges":[{"src":"I1.0.1","dst":"I2.0.1","sim":0.883,"agree":1,"disagree":0,"needs":0,"oos":1,"withdraw":0,"stances":[{"from":"clinical_trials","on":"T1/pharmacology/C2","via":"T2/clinical_trials/C5","stance":"agree","why":"ANBL0032 is the trial that led to FDA approval (ref-001), and the approval was in 2015 for this exact four-agent combination.","para":"A randomized phase III clinical trial led to FDA approval of dinutuximab in combination with GM-CSF, IL-2, and 13-cis-retinoic acid for maintenance therapy of high-risk neuroblastoma.","match":1.0},{"from":"pharmacology","on":"T1/clinical_trials/C8","via":"T2/pharmacology/C1","stance":"partial","why":"I accept the randomized survival data for the dinutuximab-containing package, but the evidence does not isolate GM-CSF's independent effect; safety and cytokine-specific toxicity data (e.g., IL-2 harms) also matter for regimen choice","para":"Clinical trial evidence supports including GM-CSF with dinutuximab for children starting therapy next week based on randomized survival data and mechanistic rationale.","match":0.801}],"withdrawals":[],"cont":true,"kind":"agree","weight":2,"id":"E0"},{"src":"I1.1.1","dst":"I2.1.1","sim":0.881,"agree":1,"disagree":0,"needs":0,"oos":2,"withdraw":0,"stances":[{"from":"immunology","on":"T1/neuroblastoma/C1","via":"T2/immunology/C1","stance":"partial","why":"My evidence independently documents resistance through GD2-negative or GD2-low disease and antigen shedding during therapy, but it does not reach the ST8SIA1 or EZH2 mechanism, which I abstain on.","para":"Lineage plasticity regulates GD2 expression; mesenchymal transition downregulates ST8SIA1 and confers resistance to dinutuximab.","match":0.768},{"from":"immunology","on":"T1/clinical_trials/C6","via":"T2/immunology/C1","stance":"agree","why":"This is the mechanism my own position rests on, and it is the reason I would not substitute an NK-directed cytokine for the myeloid one.","para":"GM-CSF enhances anti-neuroblastoma activity by increasing numbers and activation of circulating neutrophils and promoting ADCC.","match":0.828},{"from":"clinical_trials","on":"T1/neuroblastoma/C1","via":"T2/clinical_trials/C4","stance":"out_of_scope","why":"This is a claim about tumor cell biology and lineage state dynamics, not clinical trial design or outcomes. As clinical_trials, I have standing to evaluate whether regimens work and their toxicity, but not to judge the preclinical mechanisms of resistance unless they directly alter trial interpretation.","para":"Lineage plasticity in neuroblastoma regulates GD2 expression, with the adrenergic lineage strongly expressing GD2 and mesenchymal transition downregulating ST8SIA1 (GD3S).","match":0.925}],"withdrawals":[],"cont":true,"kind":"agree","weight":2,"id":"E1"},{"src":"I1.2.2","dst":"I2.2.1","sim":0.828,"agree":4,"disagree":1,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T1/immunology/C5","via":"T2/neuroblastoma/C1","stance":"agree","why":"Clinical trials have evaluated the multi-agent post-consolidation regimen but have not performed a prospective randomized head-to-head comparison of GM-CSF against G-CSF or no cytokine alongside dinutuximab.","para":"No formal comparison of GM-CSF versus G-CSF versus no cytokine with anti-GD2 antibody exists, so the strength of the evidence for GM-CSF specifically is weak by design and not by accident.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C9","via":"T2/neuroblastoma/C1","stance":"agree","why":"Dinutuximab beta is approved by the EMA in Europe for use without GM-CSF, representing an active and standard cytokine-free clinical maintenance option in SIOPEN-associated centers.","para":"A cytokine-free anti-GD2 regimen is a real and practised option, since dinutuximab beta was registered in Europe without GM-CSF and still improved outcomes over prior standards.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C13","via":"T2/neuroblastoma/C1","stance":"agree","why":"Clinical trials of anti-GD2 antibodies (such as naxitamab or dinutuximab beta) in relapsed/refractory patients with bone or bone marrow involvement have routinely incorporated GM-CSF and reported promising response rates.","para":"In the relapsed and refractory setting, the GM-CSF-containing anti-GD2 regimens are the ones with reported response data, which is a further reason not to drop the cytokine.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C3","via":"T2/neuroblastoma/C1","stance":"disagree","why":"As the neuroblastoma disease seat, I reject cross-trial survival comparisons that do not account for treatment eras, differences in patient recruitment criteria (such as risk status and MYCN amplification), and protocol variations. No randomized trial has directly compared these two regimens.","para":"Clinical trial evidence demonstrates that anti-GD2 antibodies with GM-CSF produce higher overall survival than anti-GD2 without GM-CSF: patients receiving dinutuximab with GM-CSF achieved 72% five-year overall survival compared to 63% for dinutuximab beta without cytokines.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C4","via":"T2/neuroblastoma/C1","stance":"agree","why":"This is a correct summation of the clinical trial literature; no formal prospective head-to-head trial has isolated and compared the presence versus absence of GM-CSF in anti-GD2 therapy.","para":"A comprehensive review concluded that a substantial body of clinical data supports the combination of anti-GD2 monoclonal antibodies with GM-CSF, and no formal prospective comparison between GM-CSF and no-cytokine regimens has been identified.","match":1.0}],"withdrawals":[],"cont":true,"kind":"mixed","weight":6,"id":"E2"},{"src":"I1.2.2","dst":"I2.2.2","sim":0.936,"agree":3,"disagree":0,"needs":0,"oos":1,"withdraw":0,"stances":[{"from":"immunology","on":"T1/clinical_trials/C4","via":"T2/immunology/C12","stance":"agree","why":"The absence of a formal comparison is the central fact of this question, and it is the reason I file the evidential strength for GM-CSF specifically as weak by design.","para":"A comprehensive review found a substantial body of data supporting anti-GD2 plus GM-CSF and no formal prospective comparison against no-cytokine regimens.","match":0.89},{"from":"immunology","on":"T1/pharmacology/C3","via":"T2/immunology/C6","stance":"partial","why":"The association is real in the published record but comes from non-randomised comparisons, and I decline to let it carry more than the direction of an effect.","para":"Clinical reports link the addition of GM-CSF to superior responses to anti-GD2 therapy.","match":0.899},{"from":"clinical_trials","on":"T1/immunology/C3","via":"T2/clinical_trials/C3","stance":"agree","why":"The ref-005 document explicitly states neutrophils are the major ADCC effectors in neuroblastoma, and my turn 1 claim imprecisely claimed equal emphasis on NK cells and granulocytes when the mechanistic evidence supports neutrophils as dominant.","para":"Neutrophils, not NK cells, are the principal ADCC effectors mediating anti-GD2 response, and GM-CSF is the mechanistically correct cytokine because it acts on myeloid cells.","match":0.824},{"from":"clinical_trials","on":"T1/immunology/C5","via":"T2/clinical_trials/C3","stance":"agree","why":"[author] 2024 explicitly states 'No formal comparison between GM-CSF, G-CSF, and no cytokine has been identified.' This is the evidence as written.","para":"No formal prospective comparison of GM-CSF versus G-CSF versus no cytokine with anti-GD2 antibody exists in the literature.","match":0.927}],"withdrawals":[],"cont":true,"kind":"agree","weight":4,"id":"E3"},{"src":"I1.3.2","dst":"I2.3.1","sim":0.677,"agree":1,"disagree":0,"needs":0,"oos":1,"withdraw":0,"stances":[{"from":"immunology","on":"T1/clinical_trials/C2","via":"T2/immunology/C7","stance":"partial","why":"GM-CSF acts on the myeloid compartment; the NK arm in this regimen is IL-2's, and attributing NK amplification to GM-CSF blurs the very distinction that makes the cytokine choice a mechanistic question.","para":"GM-CSF enhances dinutuximab through ADCC by amplifying granulocyte and NK cell counts and activation.","match":0.885},{"from":"immunology","on":"T1/clinical_trials/C2","via":"T2/immunology/C7","stance":"agree","why":"This is the landmark randomised result, described in the same terms in my own evidence.","para":"A randomized COG phase III trial showed dinutuximab with GM-CSF and IL-2 improved survival compared with standard therapy.","match":0.78}],"withdrawals":[],"cont":true,"kind":"agree","weight":2,"id":"E4"},{"src":"I1.3.1","dst":"I2.3.1","sim":0.666,"agree":0,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[],"withdrawals":[],"cont":true,"kind":"cont","weight":1,"id":"E5"},{"src":"I1.3.1","dst":"I2.3.2","sim":0.895,"agree":5,"disagree":0,"needs":2,"oos":2,"withdraw":0,"stances":[{"from":"immunology","on":"T1/pharmacology/C5","via":"T2/immunology/C10","stance":"agree","why":"I reach the same recommendation, and my evidence locates the severe toxicity in antibody-driven neuropathic pain rather than in the cytokine, so monitoring is an argument about the antibody, not about GM-CSF.","para":"Include GM-CSF with dinutuximab for a child starting therapy next week, with multidisciplinary monitoring and preparedness for severe adverse events.","match":0.853},{"from":"neuroblastoma","on":"T1/immunology/C7","via":"T2/neuroblastoma/C3","stance":"agree","why":"Preclinical in vitro and in vivo studies in our packet confirm that G-CSF is as potent as GM-CSF in enhancing the killing capacity of neutrophils towards dinutuximab-opsonized neuroblastoma cells.","para":"I disagree with a flat prohibition on G-CSF as the adjuvant, because the direct in vitro comparison in my packet found G-CSF equal to GM-CSF at boosting dinutuximab-mediated neutrophil killing.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C8","via":"T2/neuroblastoma/C3","stance":"needs_evidence","why":"As the neuroblastoma disease seat, my focus is on tumor biology, clinical risk stratification, and patient outcomes. The broader comparative systemic immunological effects of G-CSF versus GM-CSF on the wider myeloid compartment are outside my clinical expertise.","para":"The real immunological argument against substituting G-CSF is not ADCC potency but its effects on the wider myeloid compartment, which GM-CSF does not share.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C10","via":"T2/neuroblastoma/C3","stance":"agree","why":"The characteristic acute neuropathic pain associated with dinutuximab is driven by the antibody binding to GD2 expressed on sensory nerve fibers, which occurs independently of cytokine administration.","para":"The dominant toxicity of this regimen is antibody-driven neuropathic pain rather than anything attributable to GM-CSF, and it does not change my answer on the cytokine.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C11","via":"T2/neuroblastoma/C3","stance":"needs_evidence","why":"Our disease packet does not contain direct clinical trial safety comparisons of hematological toxicity between GM-CSF-containing and cytokine-free anti-GD2 maintenance regimens.","para":"Adding GM-CSF is not associated with a worse haematological toxicity profile than the cytokine-free regimen, which removes the main safety reason to omit it.","match":1.0},{"from":"neuroblastoma","on":"T1/pharmacology/C5","via":"T2/neuroblastoma/C3","stance":"agree","why":"This clinical choice prioritizes the survival benefits of the FDA-approved GM-CSF-containing regimen while appropriately managing toxicities through vigilant monitoring and multidisciplinary care.","para":"Because the pivotal approval and clinical reports link GM-CSF-containing dinutuximab regimens to survival benefit but cytokine combinations can add severe toxicity, I would include GM-CSF with dinutuximab for a child starting therapy next week while ensuring multidisciplinary monitoring and preparedness for severe AEs.","match":1.0},{"from":"clinical_trials","on":"T1/immunology/C7","via":"T2/clinical_trials/C6","stance":"needs_other_evidence","why":"In vitro equivalence (ref-005) does not establish clinical equivalence without prospective trial data. [author] 2024 documents that clinical data supporting G-CSF are limited compared to GM-CSF, suggesting the in vitro finding has not translated to equivalent clinical outcomes in the trials that exist.","para":"The in vitro direct comparison showed G-CSF equal to GM-CSF at boosting dinutuximab-mediated neutrophil killing.","match":0.85},{"from":"clinical_trials","on":"T1/immunology/C11","via":"T2/clinical_trials/C6","stance":"needs_other_evidence","why":"This claim requires a direct toxicity comparison between GM-CSF-containing and GM-CSF-free regimens using the same anti-GD2 antibody, patient cohort, and measurement standards. The packet documents toxicity profiles within single arms (pain, hypotension, allergic reactions) but does not provide a direct comparative toxicity analysis.","para":"Adding GM-CSF is not associated with a worse haematological toxicity profile than the cytokine-free regimen.","match":0.926},{"from":"clinical_trials","on":"T1/pharmacology/C5","via":"T2/clinical_trials/C6","stance":"agree","why":"This mirrors my own turn 1 conclusion and is grounded in FDA approval, ANBL0032 trial results, and the documented toxicity management strategies in cabral2023.","para":"I would include GM-CSF with dinutuximab for a child starting therapy next week while ensuring multidisciplinary monitoring and preparedness for severe AEs.","match":0.847}],"withdrawals":[],"cont":true,"kind":"agree","weight":8,"id":"E6"},{"src":"I1.0.2","dst":"I2.0.1","sim":0.786,"agree":0,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[],"withdrawals":[],"cont":true,"kind":"cont","weight":1,"id":"E7"},{"src":"I1.2.1","dst":"I2.2.2","sim":0.853,"agree":1,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"clinical_trials","on":"T1/immunology/C14","via":"T2/clinical_trials/C3","stance":"agree","why":"This is a pragmatic clinical stance that aligns with the trial evidence (ANBL0032 supports GM-CSF combination) while acknowledging access constraints (dinutuximab beta without GM-CSF is a regulated option in Europe). It matches the clinical reality captured in my turn 1 answer.","para":"For a child starting therapy next week, give the anti-GD2 antibody with GM-CSF where GM-CSF is obtainable, and give the antibody regardless where it is not.","match":0.961}],"withdrawals":[],"cont":true,"kind":"agree","weight":2,"id":"E8"},{"src":"I1.3.2","dst":"I2.3.2","sim":0.804,"agree":6,"disagree":0,"needs":2,"oos":1,"withdraw":0,"stances":[{"from":"immunology","on":"T1/pharmacology/C1","via":"T2/immunology/C10","stance":"agree","why":"This is the correct division of labour between the two cytokines and matches the effector account in my own evidence.","para":"Dinutuximab activity largely depends on ADCC by NK and myeloid cells, with GM-CSF augmenting myeloid effectors.","match":0.924},{"from":"immunology","on":"T1/pharmacology/C4","via":"T2/immunology/C3","stance":"agree","why":"My own evidence independently reports that subcutaneous IL-2 with intravenous dinutuximab provoked inflammatory toxicity, which is why I argue for the myeloid cytokine specifically rather than for cytokine support in general.","para":"Adding subcutaneous IL-2 to dinutuximab beta did not improve outcomes and increased toxicity, showing cytokine choices alter benefit-risk.","match":0.999},{"from":"neuroblastoma","on":"T1/immunology/C4","via":"T2/neuroblastoma/C3","stance":"agree","why":"The COG ANBL0032 trial randomized patients to the entire combination regimen vs. isotretinoin alone, and did not evaluate GM-CSF as an isolated component.","para":"The randomised survival evidence establishes the benefit of the whole dinutuximab-plus-GM-CSF-plus-IL-2-plus-isotretinoin package, not of GM-CSF as a separable component.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C2","via":"T2/neuroblastoma/C3","stance":"partial","why":"While GM-CSF enhances ADCC by expanding and activating granulocytes (neutrophils) and macrophages, natural killer (NK) cells are primarily stimulated and activated by IL-2 rather than GM-CSF.","para":"The effector mechanism by which GM-CSF enhances dinutuximab antitumor activity is through enhanced antibody-dependent cell-mediated cytotoxicity (ADCC) by amplifying granulocyte and natural killer cell counts and activation.","match":1.0},{"from":"neuroblastoma","on":"T1/pharmacology/C1","via":"T2/neuroblastoma/C3","stance":"agree","why":"This aligns with current immunological models where both NK cells (via FcγRIIIa) and neutrophils (via FcγRIIa) execute ADCC against opsonized tumor cells, with GM-CSF boosting the myeloid arm.","para":"Dinutuximab's antitumor activity largely depends on antibody-dependent cellular cytotoxicity (ADCC) mediated by NK and myeloid cells, with GM-CSF augmenting myeloid (neutrophil) effectors.","match":1.0},{"from":"clinical_trials","on":"T1/immunology/C4","via":"T2/clinical_trials/C6","stance":"agree","why":"The ANBL0032 trial compared the four-agent package to isotretinoin-only maintenance; it did not isolate GM-CSF. Immunology correctly identifies this design limitation, and it constrains any claim about GM-CSF's independent effect size.","para":"The randomized survival evidence establishes the benefit of the whole dinutuximab-plus-GM-CSF-plus-IL-2-plus-isotretinoin package, not of GM-CSF as a separable component.","match":0.998},{"from":"clinical_trials","on":"T1/neuroblastoma/C4","via":"T2/clinical_trials/C6","stance":"needs_other_evidence","why":"The ref-004 paper documents that CD47-SIRPα blockade enhanced neutrophil ADCC in vitro and in vivo. However, this is preclinical evidence for a combination (dinutuximab + CD47-SIRPα inhibition) that has not yet been tested in a clinical trial, so I cannot affirm it as a statement about clinical practice.","para":"The capacity of neutrophils to kill dinutuximab-opsonized neuroblastoma cells is controlled by the CD47-SIRPα axis, which can be targeted to further enhance cytotoxicity.","match":0.914},{"from":"clinical_trials","on":"T1/pharmacology/C1","via":"T2/clinical_trials/C6","stance":"agree","why":"The ADCC mechanism and the role of myeloid cells (particularly neutrophils) are documented in multiple papers in my packet. Pharmacology correctly emphasizes that GM-CSF augments the myeloid arm of this response.","para":"Dinutuximab's antitumor activity largely depends on antibody-dependent cellular cytotoxicity (ADCC) mediated by NK and myeloid cells, with GM-CSF augmenting myeloid (neutrophil) effectors.","match":1.0},{"from":"clinical_trials","on":"T1/pharmacology/C4","via":"T2/clinical_trials/C6","stance":"needs_other_evidence","why":"The packet documents that zang2023 reports IL-2 plus dinutuximab triggered adverse symptoms with inflammatory responses, but I do not find a prospective randomized trial comparing dinutuximab beta with IL-2 to dinutuximab beta without IL-2 with survival endpoints. This claim may be supported unology","on":"T1/clinical_trials/C7","via":"T2/immunology/C2","stance":"needs_evidence","why":"Nothing in my evidence documents why that dossier was composed as it was, and I have filed an abstention rather than adopt a plausible regulatory story as an immunological fact.","para":"The EMA approval of dinutuximab beta without GM-CSF was likely due to regulatory and product availability factors rather than lack of efficacy.","match":0.819},{"from":"immunology","on":"T1/clinical_trials/C8","via":"T2/immunology/C2","stance":"agree","why":"This is the same operational conclusion I reach, and with the same stated gap, though I would add that the antibody should be given even where sargramostim cannot be obtained.","para":"For a child starting therapy next week, include GM-CSF with dinutuximab, acknowledging no head-to-head randomized comparison exists.","match":0.596},{"from":"immunology","on":"T1/pharmacology/C2","via":"T2/immunology/C2","stance":"agree","why":"This is a statement of the regulatory and trial record, which my own evidence reports in the same form.","para":"A randomized phase III trial led to FDA approval of dinutuximab with GM-CSF, IL-2 and 13-cis-retinoic acid for maintenance of high-risk neuroblastoma.","match":0.994},{"from":"clinical_trials","on":"T1/neuroblastoma/C3","via":"T2/clinical_trials/C4","stance":"agree","why":"This is the ANBL0032 trial result documented in ref-001: 2-year event-free survival improved from 46% to 66%, and 2-year OS from 78% to 86%. The 5-year data have not appeared in my packet, but the 2-year surrogate supports this claim.","para":"Anti-GD2 immunotherapy with dinutuximab in combination with alternating cycles of GM-CSF and IL-2 significantly improves five-year event-free survival and overall survival compared to isotretinoin maintenance alone.","match":0.765}],"withdrawals":[],"cont":false,"kind":"agree","weight":4,"id":"E11"},{"src":"I1.3.2","dst":"I2.1.1","sim":0.628,"agree":1,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"immunology","on":"T1/neuroblastoma/C4","via":"T2/immunology/C1","stance":"agree","why":"This is the closest any seat has come to my own position on the effector hierarchy, and my evidence adds the macrophage phagocytic arm that the same checkpoint releases.","para":"Dinutuximab activity depends on ADCC by neutrophils and NK cells, and neutrophil killing of opsonised cells is controlled by the CD47-SIRP-alpha axis.","match":0.86}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E12"},{"src":"I1.2.2","dst":"I2.3.2","sim":0.842,"agree":3,"disagree":1,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"immunology","on":"T1/clinical_trials/C3","via":"T2/immunology/C3","stance":"disagree","why":"That contrast varies the antibody, the induction regimen and the eligibility criteria along with the cytokine, and my own evidence states plainly that such cross-trial comparisons cannot establish that one regimen is superior.","para":"Patients receiving dinutuximab with GM-CSF achieved 72% five-year OS versus 63% for dinutuximab beta without cytokines, demonstrating higher survival with GM-CSF.","match":0.82},{"from":"neuroblastoma","on":"T1/immunology/C3","via":"T2/neuroblastoma/C3","stance":"agree","why":"GM-CSF stimulates and activates granulocytes (neutrophils) and monocytes/macrophages, which are the main myeloid effectors of anti-GD2 antibody-dependent cellular cytotoxicity.","para":"GM-CSF is the mechanistically correct cytokine choice because it acts on precisely the myeloid effectors that execute anti-GD2 ADCC, and its addition has been associated with improved overall clinical response.","match":1.0},{"from":"neuroblastoma","on":"T1/pharmacology/C3","via":"T2/neuroblastoma/C3","stance":"agree","why":"The clinical benefit observed with the addition of GM-CSF is consistent with preclinical findings showing that cytokines significantly boost neutrophil-mediated ADCC.","para":"Clinical reports link the addition of GM-CSF to superior responses to anti-GD2 therapy, consistent with enhanced neutrophil-mediated effector function.","match":1.0},{"from":"clinical_trials","on":"T1/immunology/C9","via":"T2/clinical_trials/C6","stance":"agree","why":"The EMA approval of dinutuximab beta without GM-CSF (ref-006) is documented, and balaguer2023 confirms objective responses in both first-line and relapsed settings, establishing that a cytokine-free regimen produces measurable clinical benefit.","para":"Dinutuximab beta was registered in Europe without GM-CSF and still improved outcomes over prior standards, indicating a cytokine-free anti-GD2 regimen is viable.","match":0.973}],"withdrawals":[],"cont":false,"kind":"mixed","weight":4,"id":"E13"},{"src":"I1.0.1","dst":"I2.3.2","sim":0.763,"agree":5,"disagree":0,"needs":0,"oos":1,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T1/immunology/C1","via":"T2/neuroblastoma/C3","stance":"agree","why":"The historical clinical trials in North America (e.g., COG ANBL0032) that established the standard of care for high-risk neuroblastoma maintenance therapy utilized GM-CSF as a core component of the post-consolidation immunotherapy regimen.","para":"GM-CSF should be part of the dinutuximab regimen in high-risk neuroblastoma because GM-CSF is the myeloid-arm adjuvant whose combination with anti-GD2 antibody carries the accumulated clinical record.","match":0.949},{"from":"neuroblastoma","on":"T1/clinical_trials/C1","via":"T2/neuroblastoma/C3","stance":"agree","why":"This statement is fully grounded in the landmark COG ANBL0032 trial, which demonstrated superior EFS and OS for the immunotherapy combination and led to FDA approval.","para":"GM-CSF should be given with dinutuximab in high-risk neuroblastoma because large randomized phase III evidence shows that dinutuximab combined with GM-CSF and IL-2 improves survival, and the US FDA approved this combination specifically for this indication.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C5","via":"T2/neuroblastoma/C3","stance":"agree","why":"The COG ANBL0032 trial randomized high-risk patients who responded to induction and consolidation to receive either immunotherapy (dinutuximab + GM-CSF + IL-2 + isotretinoin) or standard therapy (isotretinoin alone), showing a significant survival advantage for the immunotherapy group.","para":"In a randomized phase III trial by the Children's Oncology Group, dinutuximab combined with GM-CSF and IL-2 improved survival rates among children with high-risk neuroblastoma compared to standard therapy.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C7","via":"T2/neuroblastoma/C3","stance":"partial","why":"While regulatory and availability factors may have influenced the EMA's decision, the clinical efficacy of dinutuximab beta alone as maintenance therapy was established in large European trials, demonstrating that the antibody is active even without exogenous cytokines.","para":"While the European Medicines Agency approved dinutuximab beta for high-risk neuroblastoma without GM-CSF, the absence of GM-CSF in that approval was likely due to regulatory and product availability factors rather than evidence of lack of efficacy.","match":1.0},{"from":"neuroblastoma","on":"T1/clinical_trials/C8","via":"T2/neuroblastoma/C3","stance":"agree","why":"The FDA-approved combination represents a well-established and highly effective clinical regimen, and the biological rationale of enhancing myeloid-mediated ADCC is strong, despite the lack of a head-to-head randomized trial against cytokine-free regimens.","para":"For a child starting high-risk neuroblastoma therapy next week, the clinical evidence supports including GM-CSF with dinutuximab based on FDA approval of this combination, superior five-year overall survival data, and mechanistic rationale through ADCC enhancement, though the evidence base lacks a formal head-to-head randomized comparison with non-GM-CSF regimens.","match":1.0},{"from":"neuroblastoma","on":"T1/pharmacology/C2","via":"T2/neuroblastoma/C3","stance":"agree","why":"This is a factually correct summary of the clinical path to FDA approval for dinutuximab.","para":"A randomized phase III clinical trial led to FDA approval of dinutuximab in combination with GM-CSF, IL-2, and 13-cis-retinoic acid for maintenance therapy of high-risk neuroblastoma.","match":1.0}],"withdrawals":[],"cont":false,"kind":"agree","weight":5,"id":"E14"},{"src":"I1.2.1","dst":"I2.2.1","sim":0.704,"agree":1,"disagree":0,"needs":0,"oos":1,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T1/immunology/C12","via":"T2/neuroblastoma/C1","stance":"partial","why":"While dinutuximab requires immune effector cells to execute ADCC, endogenous effector cells are present in patients. This is demonstrated by the clinical efficacy and EMA approval of cytokine-free dinutuximab beta, which relies entirely on endogenous effector support.","para":"Anti-GD2 antibody without effector support is not a viable regimen, so the question is which cytokine, not whether any.","match":1.0},{"from":"neuroblastoma","on":"T1/immunology/C14","via":"T2/neuroblastoma/C1","stance":"agree","why":"This pragmatic approach aligns with clinical guidelines: combining anti-GD2 with GM-CSF is supported by strong FDA-approved trial data, but if GM-CSF is unavailable, the anti-GD2 antibody should still be administered given its intrinsic antitumor activity.","para":"For a child starting therapy next week, the immunology I can defend says give the anti-GD2 antibody with GM-CSF where GM-CSF is obtainable, and give the antibody regardless where it is not.","match":1.0}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E15"},{"src":"I1.1.1","dst":"I2.3.2","sim":0.571,"agree":1,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T1/clinical_trials/C6","via":"T2/neuroblastoma/C3","stance":"agree","why":"Preclinical and clinical data confirm that GM-CSF expands the neutrophil population and enhances neutrophil-mediated ADCC against GD2-expressing neuroblastoma cells.","para":"GM-CSF enhances the anti-neuroblastoma activity of anti-GD2 antibodies by increasing the numbers and activation of circulating neutrophils and promoting antibody-dependent cell-mediated cytotoxicity.","match":1.0}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E16"},{"src":"I1.3.2","dst":"I2.2.1","sim":0.584,"agree":1,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T1/pharmacology/C4","via":"T2/neuroblastoma/C1","stance":"agree","why":"The SIOPEN HR-NBL1 trial demonstrated that the addition of subcutaneous IL-2 to dinutuximab beta added severe toxicity without improving EFS or OS, leading to the removal of IL-2 from standard European protocols.","para":"Adding subcutaneous IL-2 to dinutuximab beta did not improve outcomes and increased toxicity, indicating cytokine choices alter benefit-risk.","match":1.0}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E17"},{"src":"I1.1.1","dst":"I2.0.1","sim":0.656,"agree":1,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"pharmacology","on":"T1/neuroblastoma/C1","via":"T2/pharmacology/C1","stance":"agree","why":"[author] et al. (ref-003) explicitly report reduced ST8SIA1 and GD2 in mesenchymal states and restoration by EZH2 inhibition","para":"Lineage plasticity (mesenchymal shift) reduces GD2 via ST8SIA1 downregulation and confers resistance to anti-GD2 antibodies.","match":0.681}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E18"},{"src":"I2.0.1","dst":"I3.0.1","sim":0.927,"agree":9,"disagree":0,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"neuroblastoma","on":"T2/clinical_trials/C5","via":"T3/neuroblastoma/C2","stance":"agree","why":"This is consistent with current standard frontline protocols in the COG region.","para":"Clinical evidence supports including GM-CSF for a child starting therapy next week based on FDA approval and superior survival"," :"T3/clinical_trials/C5","stance":"agree","why":"This is established fact in my evidence. The trial showed event-free and overall survival benefit for the package. I agree on the outcome; I remain agnostic on the separable contribution of GM-CSF alone.","para":"The COG ANBL0032 randomized trial demonstrated that adding dinutuximab with GM-CSF and IL-2 to isotretinoin improved event-free and overall survival in high-risk neuroblastoma.","match":1.0},{"from":"clinical_trials","on":"T2/pharmacology/C1","via":"T3/clinical_trials/C5","stance":"agree","why":"The SIOPEN trial cited in my evidence confirms this. Adding IL-2 to dinutuximab beta did not improve survival and worsened toxicity. This supports the broader principle that not all cytokines are beneficial even when mechanistically plausible.","para":"Adding subcutaneous IL-2 to dinutuximab beta did not improve outcomes and increased toxicity, indicating cytokine choices alter benefit-risk.","match":0.603}],"withdrawals":[],"cont":true,"kind":"agree","weight":10,"id":"E19"},{"src":"I2.1.1","dst":"I3.1.1","sim":0.958,"agree":2,"disagree":1,"needs":0,"oos":0,"withdraw":0,"stances":[{"from":"immunology","on":"T2/clinical_trials/C4","via":"T3/immunology/C3","stance":"disagree","why":"That contrast compares different antibodies, different induction and consolidation regimens and different eligibility criteria, and the review it comes from says itself that it is unknown whether the difference is due to GM-CSF or to the antibody.","para":"Anti-GD2 with GM-CSF produces higher overall survival than anti-GD2 without GM-CSF: 72% versus 63% five-year OS","match":0.741},{"from":"immunology","on":"T2/clinical_trials/C2","via":"T3/immunology/C9","stance":"agree","why":"This matches the mechanism in my evidence, where myeloid cells are put into overdrive with growth factors such as GM-CSF and neutrophils are a principal effector arm.","para":"GM-CSF enhances anti-neuroblastoma activity by increasing circulating neutrophil numbers an ical trend to maximize myeloid effector activation in post-consolidation.","para":"Contemporary practice pairs GM-CSF even with dinutuximab beta","match":0.763},{"from":"neuroblastoma","on":"T2/clinical_trials/C6","via":"T3/neuroblastoma/C1","stance":"agree","why":"FDA approved dinutuximab specifically in combination with GM-CSF, IL-2, and isotretinoin based on ANBL0032.","para":"GM-CSF should be given with dinutuximab based on randomized phase III evidence and FDA approval","match":0.87},{"from":"neuroblastoma","on":"T2/clinical_trials/C6","via":"T3/neuroblastoma/C1","stance":"partial","why":"GM-CSF primarily activates myeloid lineages (granulocytes and macrophages) rather than NK cells.","para":"GM-CSF enhances dinutuximab activity by amplifying granulocyte and NK cell counts and activation","match":0.752},{"from":"neuroblastoma","on":"T2/clinical_trials/C6","via":"T3/neuroblastoma/C1","stance":"agree","why":"The COG ANBL0032 study showed significantly superior 2-year and 5-year survival outcomes.","para":"Dinutuximab combined with GM-CSF and IL-2 improved survival rates compared to standard therapy","match":0.863},{"from":"neuroblastoma","on":"T2/clinical_trials/C6","via":"T3/neuroblastoma/C1","stance":"out_of_scope","why":"Regulatory and commercial availability considerations are outside our disease biology scope.","para":"Absence of GM-CSF in European approval of dinutuximab beta was likely due to regulatory and product availability factors","match":0.831},{"from":"neuroblastoma","on":"T2/clinical_trials/C6","via":"T3/neuroblastoma/C1","stance":"agree","why":"European trials using dinutuximab beta without GM-CSF demonstrated comparable long-term outcomes.","para":"Dinutuximab beta approved without GM-CSF achieves survival outcomes not clearly inferior, suggesting cytokine is not absolutely necessary","match":0.95}],"withdrawals":[],"cont":false,"kind":"agree","weight":8,"id":"E30"},{"src":"I2.1.1","dst":"I3.0.1","sim":0.736,"agree":4,"disagree":0,"needs":0,"oos  2022 review I cited notes exactly this: many trials included stage 4S patients or infants <18 months under the 'high-risk' label, which inflates survival estimates. This is a critical trial design issue that weakens cross-trial comparisons.","para":"Evaluating clinical trials of anti-GD2 immunotherapy requires careful consideration of patient recruitment criteria, as inclusion of better-prognosis subgroups can bias overall survival estimations.","match":0.994}],"withdrawals":[],"cont":false,"kind":"agree","weight":1,"id":"E34"}],"layout":{"node_w":196,"node_h":92,"seat_w":150,"seat_h":46,"tb":{"width":1706,"height":911,"turn":{"1":225,"2":487,"3":749},"seats":{"neuroblastoma":{"x":521.0,"y":50},"clinical_trials":{"x":720.5,"y":50},"immunology":{"x":888.5,"y":50},"pharmacology":{"x":1056.5,"y":50}}},"lr":{"width":1438,"height":958,"turn":{"1":370,"2":776,"3":1182},"seats":{"neuroblastoma":{"x":30,"y":335.0},"clinical_trials":{"x":30,"y":456.0},"immunology":{"x":30,"y":534.4},"pharmacology":{"x":30,"y":598.4}}}},"docs":{"ref-001":{"title":"Pediatric tumor microenvironment: developmental dynamics and therapy resistance","year":2025,"venue":"Frontiers in oncology","doi":"10.3389/fonc.2025.1663975","pmid":"41357586"},"ref-002":{"title":"Nonspecific Gastrointestinal Symptoms as the First Sign of Ganglioneuroblastoma Intermixed-Case Report and Literature Review","year":2023,"venue":"Journal of clinical medicine","doi":"10.3390/jcm12186092","pmid":"37763032"}},"has_stances":true,"labelled":19,"stats":{"claims":76,"stances":144,"stances_resolved":143,"withdrawals":0,"abstentions":32}};</script>

  const g0 = G(), tb = O === "tb", s0 = g0.seats[seatOrder[0]] || {x: 30, y: 30};

  out.push(tb ? `<rect x="0" y="${s0.y - 18}" width="${g0.width}" height="${L.seat_h + 36}" fill="#f6f4fb"/>`
              : `<rect x="${s0.x - 14}" y="0" width="${L.seat_w + 28}" height="${g0.height}" fill="#f6f4fb"/>`);
  turns.forEach((t, k) => {
    const v = g0.turn[t], fill = k % 2 ? "#f7f9fb" : "#fbfcfd";
    out.push(tb ? `<rect x="0" y="${v - 34}" width="${g0.width}" height="${H + 68}" fill="${fill}" stroke="#eef0f3"/>`
                : `<rect x="${v - 30}" y="0" width="${W + 60}" height="${g0.height}" fill="${fill}" stroke="#eef0f3"/>`);
  });
  // theme groups per turn: similar ideas sit together and share a shade
  turns.forEach(t => {
    const groups = {};
    const ext = tb ? W : H;
    D.ideas.filter(i => i.t === t).forEach(i => { const g = groups[i.theme] = groups[i.theme] || {a0: 1e9, a1: -1e9};
      const c = tb ? P(i).x : P(i).y; g.a0 = Math.min(g.a0, c); g.a1 = Math.max(g.a1, c + ext); });
    Object.entries(groups).forEach(([th, g]) => {
      const h = hue(+th), v = g0.turn[t], lab = A(themeLabel(+th));
      const r = tb ? [g.a0 - 7, v - 9, g.a1 - g.a0 + 14, H + 18] : [v - 7, g.a0 - 7, W + 14, g.a1 - g.a0 + 14];
      const lx = tb ? (g.a0 + g.a1) / 2 : v + W / 2, ly = tb ? v - 14 : g.a0 - 10;
      out.push(`<g class="tgroup" data-theme="${th}"><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="10" fill="hsl(${h},60%,86%)" fill-opacity=".6" stroke="hsl(${h},50%,68%)"/>` +
        `<text class="glabel" x="${lx}" y="${ly}" text-anchor="middle" fill="hsl(${h},45%,30%)" data-w="${tb ? g.a1 - g.a0 + 10 : W + 10}" data-max="${tb ? 46 : 13}" data-long="${esc(lab)}" data-short="${esc(lab.split(" ? ")[0])}">${esc(lab)}</text></g>`);
    });
  });
  // seat roots
  if (S.roots){
    D.ideas.filter(i => i.t === turns[0]).forEach(i => {
      const cnt = {}; i.members.forEach(m => { const s = memberSeat(m); cnt[s] = (cnt[s] || 0) + 1; });
      Object.entries(cnt).forEach(([s, n]) => {
        const p = g0.seats[s]; if (!p) return;
        const q = P(i);
        let d;
        if (tb){ const ax = p.x + L.seat_w / 2, ay = p.y + L.seat_h, bx = q.x + W/2, by = q.y, dy = (by - ay) * 0.5;
          d = `M${ax},${ay} C${ax},${ay + dy} ${bx},${by - dy} ${bx},${by}`; }
        else { const ax = p.x + L.seat_w, ay = p.y + L.seat_h / 2, bx = q.x, by = q.y + H/2, dx = (bx - ax) * 0.5;
          d = `M${ax},${ay} C${ax + dx},${ay} ${bx - dx},${by} ${bx},${by}`; }
        out.push(`<path class="root" data-seat="${esc(s)}" data-idea="${i.id}" d="${d}" fill="none" stroke="${seatCol(s)}" stroke-width="${(0.8 + 0.9 * n).toFixed(1)}" opacity=".32"/>`);
      });
    });
  }
  // edges (draw weak kinds first so contradictions sit on top)
  const zord = {cont:0, agree:1, needs:2, mixed:3, disagree:4, withdraw:5};
  [...VIS].sort((a, b) => zord[a.kind] - zord[b.kind]).forEach(e => {
    const a = ideaById[e.src], b = ideaById[e.dst]; if (!a || !b) return;
    const d = edgePath(a, b), w = e.kind === "cont" ? (D.has_stances ? 1.2 : 1.8) : 1 + 1.15 * Math.sqrt(e.weight);
    const dash = e.kind === "withdraw" ? ' stroke-dasharray="7 4"' : e.kind === "cont" ? ' stroke-dasharray="2 4"' : "";
    const op = e.kind === "cont" ? (D.has_stances ? .5 : .8) : e.kind === "agree" || e.kind === "needs" ? .38 : .7;
    out.push(`<g class="edge" data-id="${e.id}" opacity="${op}"><path d="${d}" fill="none" stroke="${KCOL[e.kind]}" stroke-width="${w.toFixed(2)}"${dash}/><path class="hit" d="${d}" stroke-width="10"/></g>`);
  });
  // seats
  seatOrder.forEach(s => {
    const p = g0.seats[s]; if (!p) return;
    const si = SI[s] || {};
    out.push(`<g class="seat" data-seat="${esc(s)}" transform="translate(${p.x},${p.y})" style="cursor:pointer">
      <rect width="${L.seat_w}" height="${L.seat_h}" rx="${si.kind === "discipline" ? 4 : 23}" fill="${seatCol(s)}"/>
      <text x="${L.seat_w/2}" y="20" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">${esc(seatName(s))}</text>
      <text x="${L.seat_w/2}" y="36" text-anchor="middle" fill="#fff" font-size="10.5" opacity=".9">${si.kind === "discipline" ? "discipline seat" : "scientist seat"}</text></g>`);
  });
  // idea nodes
  const nS = seatOrder.length, bw = Math.min(22, (W - 16) / nS);
  D.ideas.forEach(i => {
    const st = nodeStyle(i), h = hue(i.theme);
    const fill = `hsl(${h},62%,95%)`, stroke = `hsl(${h},45%,38%)`;
    const cnt = {}; i.members.forEach(m => { const s = memberSeat(m); cnt[s] = (cnt[s] || 0) + 1; });
    let bars = "";
    seatOrder.forEach((s, k) => {
      const n = cnt[s] || 0, r = (i.reception || {})[s], v = r ? r.verdict : null;
      const bc = v ? (VCOL[v] || "#333") : "#c9ced6";
      bars += `<rect x="${(8 + k * bw).toFixed(1)}" y="${H - 22}" width="${(bw - 3).toFixed(1)}" height="15" rx="2" fill="${n ? seatCol(s) : "#fff"}" fill-opacity="${n ? Math.min(1, .55 + .25 * n) : 1}" stroke="${bc}" stroke-width="${v ? 2.2 : .8}"/>`;
    });
    const g = [];
    if (i.withdrawn_frac > 0) g.push(`<tspan fill="${i.withdrawn_frac >= .5 ? "#b00" : "#666"}">⊘</tspan>`);
    if (i.is_revision) g.push(`<tspan fill="#1f5fbf">↺</tspan>`);
    if (i.n_disagree > 0) g.push(`<tspan fill="#d62728">⚡</tspan>`);
    if (i.split) g.push(`<tspan fill="#555">⋔</tspan>`);
    if (i.merge) g.push(`<tspan fill="#555">⋈</tspan>`);
    out.push(`<g class="node" data-id="${i.id}" transform="translate(${P(i).x},${P(i).y})" opacity="${st.op.toFixed(2)}">
      <rect class="box" width="${W}" height="${H}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${st.sw.toFixed(2)}"${st.dash ? ` stroke-dasharray="${st.dash}"` : ""}/>
      <rect x="0" y="0" width="5" height="${H}" rx="2" fill="hsl(${h},60%,50%)"/>
      <foreignObject x="9" y="4" width="${W - 14}" height="44"><div xmlns="http://www.w3.org/1999/xhtml" class="ttl" style="font-weight:${st.fw}">${esc(A(TT(i)))}</div></foreignObject>
      <text x="9" y="${H - 28}" font-size="10" fill="#555">${i.n_claims} claim${i.n_claims > 1 ? "s" : ""} · ${i.authors.length} seat${i.authors.length > 1 ? "s" : ""} · ${i.n_docs} ref${i.n_docs === 1 ? "" : "s"}</text>
      <text x="${W - 6}" y="${H - 28}" font-size="12" text-anchor="end">${g.join(" ")}</text>
      ${bars}</g>`);
  });
  vp.innerHTML = out.join("");
  bindSvg();
  applyHighlight();
  renderTurnLabels();
}

// ---------- highlight logic
function baseFilter(){
  let nodes = null;
  const add = f => { const s = new Set(D.ideas.filter(f).map(i => i.id)); nodes = nodes ? new Set([...nodes].filter(x => s.has(x))) : s; };
  if (S.theme != null) add(i => i.theme === S.theme);
  if (S.seat) add(i => i.authors.includes(S.seat));
  if (S.q){
    const q = S.q.toLowerCase();
    add(i => [i.title, i.topic, i.gist].some(x => (x || "").toLowerCase().includes(q)) || i.members.some(m => { const c = claimById[m]; if (!c) return false;
      return c.text.toLowerCase().includes(q) || A(c.text).toLowerCase().includes(q) || (c.cits || []).some(x => (x.quote || "").toLowerCase().includes(q) || x.doc.toLowerCase().includes(q) || strip((D.docs[x.doc] || {}).title).toLowerCase().includes(q)); }));
  }
  if (S.spot !== "none"){
    const nS = D.seats.length;
    const f = {
      contested: i => i.n_disagree > 0 || VIS.some(e => (e.src === i.id || e.dst === i.id) && (e.kind === "disagree" || e.kind === "mixed")),
      withdrawn: i => i.withdrawn_frac > 0 || VIS.some(e => e.kind === "withdraw" && (e.src === i.id || e.dst === i.id)),
      revision: i => i.is_revision,
      mergesplit: i => i.merge || i.split,
      consensus: i => i.authors.length >= Math.ceil(nS * 2 / 3) && i.strength >= .7,
      minority: i => i.authors.length === 1 && i.n_docs >= 2
    }[S.spot];
    add(f);
  }
  if (!nodes) return null;
  const edges = new Set(VIS.filter(e => nodes.has(e.src) && nodes.has(e.dst)).map(e => e.id));
  return {nodes, edges, roots: new Set([...nodes].filter(n => ideaById[n].t === turns[0])), seat: S.seat};
}
function applyHighlight(){
  let hl = null;
  const focus = S.hover || S.pinned;
  if (focus){
    if (focus.type === "idea") hl = lineage(focus.id);
    else if (focus.type === "edge"){ const e = D.edges.find(x => x.id === focus.id); hl = {nodes: new Set([e.src, e.dst]), edges: new Set([e.id]), roots: new Set()}; }
    else if (focus.type === "seat"){ const ns = new Set(D.ideas.filter(i => i.authors.includes(focus.id)).map(i => i.id));
      hl = {nodes: ns, edges: new Set(VIS.filter(e => ns.has(e.src) && ns.has(e.dst)).map(e => e.id)), roots: ns, seat: focus.id}; }
  } else hl = baseFilter();
  vp.querySelectorAll(".node").forEach(n => { n.classList.toggle("dim", !!hl && !hl.nodes.has(n.dataset.id)); n.classList.toggle("sel", !!(S.pinned && S.pinned.type === "idea" && S.pinned.id === n.dataset.id)); });
  vp.querySelectorAll(".edge").forEach(n => { const on = hl && hl.edges.has(n.dataset.id); n.classList.toggle("dim", !!hl && !on); n.classList.toggle("hl", !!on); });
  vp.querySelectorAll(".root").forEach(n => { const on = hl && hl.roots.has(n.dataset.idea) && (!hl.seat || hl.seat === n.dataset.seat);
    n.classList.toggle("dim", !!hl && !on); n.classList.toggle("hl", !!on); });
  vp.querySelectorAll(".tgroup").forEach(n => n.classList.toggle("dim", !!hl && !D.ideas.some(i => i.theme === +n.dataset.theme && hl.nodes.has(i.id))));
  vp.querySelectorAll(".seat").forEach(n => { const s = n.dataset.seat;
    const on = !hl || (hl.seat ? hl.seat === s : [...hl.roots].some(r => ideaById[r].authors.includes(s)));
    n.classList.toggle("dim", !on); });
}

// ---------- events on svg
function bindSvg(){
  vp.querySelectorAll(".node").forEach(n => {
    const id = n.dataset.id;
    n.addEventListener("mouseenter", ev => { S.hover = {type: "idea", id}; applyHighlight(); showTip(ev, ideaTip(ideaById[id])); });
    n.addEventListener("mousemove", ev => moveTip(ev));
    n.addEventListener("mouseleave", () => { S.hover = null; applyHighlight(); hideTip(); });
    n.addEventListener("click", ev => { ev.stopPropagation(); selectIdea(id, false); });
  });
  vp.querySelectorAll(".edge").forEach(n => {
    const id = n.dataset.id;
    n.addEventListener("mouseenter", ev => { const e = D.edges.find(x => x.id === id); showTip(ev, edgeTip(e)); });
    n.addEventListener("mousemove", ev => moveTip(ev));
    n.addEventListener("mouseleave", hideTip);
    n.addEventListener("click", ev => { ev.stopPropagation(); S.pinned = {type: "edge", id}; applyHighlight(); showEdge(D.edges.find(x => x.id === id)); });
  });
  vp.querySelectorAll(".seat").forEach(n => {
    const s = n.dataset.seat;
    n.addEventListener("mouseenter", () => { S.hover = {type: "seat", id: s}; applyHighlight(); });
    n.addEventListener("mouseleave", () => { S.hover = null; applyHighlight(); });
    n.addEventListener("click", ev => { ev.stopPropagation(); S.pinned = {type: "seat", id: s}; applyHighlight(); showSeat(s); });
  });
}
function ideaTip(i){

function edgeTip(e){
  const parts = [];

  return `<b>${esc(KNAME[e.kind])}</b><br>${esc(e.src)} → ${esc(e.dst)}<br>${parts.join(" · ") || "semantic continuation"} · similarity ${e.sim}`;
}
function showTip(ev, html){ tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev){ const r = $("stage").getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;

// ---------- zoom / pan
const T = {k: 1, x: 0, y: 0};
function applyT(){ vp.setAttribute("transform", `translate(${T.x.toFixed(1)},${T.y.toFixed(1)}) scale(${T.k.toFixed(4)})`); positionTurnLabels(); scaleLabels(); drawMiniView(); }
let lastK = -1;
function scaleLabels(){
  if (Math.abs(T.k - lastK) < 1e-4) return; lastK = T.k;
  vp.querySelectorAll(".glabel").forEach(el => {
    const w = +el.dataset.w; let txt = el.dataset.long;
    const mx = +el.dataset.max || 46;
    let fs = Math.min(12 / T.k, mx, w / (0.58 * txt.length));
    if (fs * T.k < 8){ txt = el.dataset.short; fs = Math.min(12 / T.k, mx, w / (0.58 * txt.length)); }
    el.textContent = fs * T.k < 5 ? "" : txt; el.setAttribute("font-size", fs.toFixed(1));
  });
}
// minimap (overview + detail)
const mini = $("mini"); let MW = 260, MH = 60, MS = 1;
function drawMini(){
  MS = Math.min(260 / G().width, 220 / G().height); MW = Math.round(G().width * MS); MH = Math.max(30, Math.round(G().height * MS));
  mini.setAttribute("width", MW); mini.setAttribute("height", MH);
  mini.innerHTML = D.ideas.map(i => `<rect x="${(P(i).x * MS).toFixed(1)}" y="${(P(i).y * MS).toFixed(1)}" width="${Math.max(1, W * MS - .4).toFixed(1)}" height="${Math.max(1.5, H * MS).toFixed(1)}" fill="hsl(${hue(i.theme)},60%,55%)" opacity="${(.35 + .65 * i.strength).toFixed(2)}"/>`).join("") + '<rect class="vr" id="minivr"/>';
}
function drawMiniView(){
  const r = svg.getBoundingClientRect(), vr = $("minivr"); if (!vr || !r.width) return;
  const x = -T.x / T.k * MS, y = -T.y / T.k * MS, w = r.width / T.k * MS, h = r.height / T.k * MS;
  vr.setAttribute("x", x); vr.setAttribute("y", y); vr.setAttribute("width", w); vr.setAttribute("height", h);

function miniGo(ev){ const b = mini.getBoundingClientRect(), r = svg.getBoundingClientRect();
  const gx = (ev.clientX - b.left) / MS, gy = (ev.clientY - b.top) / MS; T.x = r.width / 2 - gx * T.k; T.y = r.height / 2 - gy * T.k; applyT(); }
let miniDrag = false;
mini.addEventListener("mousedown", ev => { ev.stopPropagation(); miniDrag = true; miniGo(ev); });
window.addEventListener("mousemove", ev => { if (miniDrag) miniGo(ev); });
window.addEventListener("mouseup", () => miniDrag = false);
mini.addEventListener("click", ev => ev.stopPropagation());
function fit(readable){
  const r = svg.getBoundingClientRect(), g = G();
  if (r.width < 40 || r.height < 40) return;
  if (O === "tb"){
    const kx = (r.width - 120) / g.width, ky = (r.height - 20) / g.height;
    T.k = readable ? ky : Math.min(kx, ky);
    T.x = readable ? 110 : 110 + ((r.width - 120) - g.width * T.k) / 2;
    T.y = (r.height - g.height * T.k) / 2;
  } else {
    const kx = (r.width - 20) / g.width, ky = (r.height - 60) / g.height;
    T.k = readable ? Math.min(kx, 1.1) : Math.min(kx, ky);
    T.x = (r.width - g.width * T.k) / 2;
    T.y = readable ? 56 : 56 + ((r.height - 60) - g.height * T.k) / 2;
  }
  applyT();
}
function centerOn(i, kmin){
  const r = svg.getBoundingClientRect();
  T.k = Math.max(T.k, kmin || 0.75);
  const q = P(i); T.x = r.width / 2 - (q.x + W/2) * T.k; T.y = r.height / 2 - (q.y + H/2) * T.k; applyT();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(4, Math.max(0.03, T.k * Math.exp(-ev.deltaY * 0.0015)));
  T.x = mx - (mx - T.x) * k / T.k; T.y = my - (my - T.y) * k / T.k; T.k = k; applyT();
}, {passive: false});
let drag = null;
svg.addEventListener("mousedown", ev => { drag = {x: ev.clientX, y: ev.clientY, tx: T.x, ty: T.y, moved: false}; svg.classList.add("drag"); });
window.addEventListener("mousemove", ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; T.x = drag.tx + dx; T.y = drag.ty + dy; applyT(); });
window.addEventListener("mouseup", () => { svg.classList.remove("drag"); setTimeout(() => drag = null, 0); });

function claimCard(c, open){
  const parts = [];
  parts.push(`<details${open ? " open" : ""}><summary>${seatChip(c.seat)} <b>${esc(cid(c.id))}</b> ${c.type ? `<span class="small">${esc(c.type.replace(/_/g, " "))}</span>` : ""} ${c.territory ? `<span class="chip k-cont">${esc(c.territory)}</span>` : ""}${c.is_withdrawal ? kchip("withdraw", "withdrawal") : ""}${(c.withdrawn_by || []).length ? kchip("withdraw", "later withdrawn") : ""}</summary>`);
  parts.push(`<div style="margin:4px 0">${esc(A(c.text))}</div>`);
  if (c.withdraws) parts.push(`<div class="small">⊘ withdraws ${clink(c.withdraws)}</div>`);
  if ((c.withdrawn_by || []).length) parts.push(`<div class="small">⊘ withdrawn by ${c.withdrawn_by.map(clink).join(", ")}</div>`);
  if (c.self_challenge) parts.push(`<div class="small" style="margin-top:4px"><b>self-challenge:</b> ${esc(A(c.self_challenge))}</div>`);
  const dec = Object.entries(c.declared || {}).filter(([, v]) => v);
  if (dec.length) parts.push(`<div class="small">declared: ${dec.map(([k, v]) => `${esc(k)}=${esc(Array.isArray(v) ? v.join(", ") : v)}`).join(" · ")}</div>`);
  if ((c.cits || []).length) parts.push(`<h4>evidence (${c.cits.length})</h4>` + c.cits.map(docLine).join(""));
  if ((c.reviews || []).length) parts.push(`<h4>peer review of these citations</h4>` + c.reviews.map(r => `<div class="cit">${kchip(r.verdict)} by ${seatChip(r.by)} on <code>${esc(r.doc)}</code> <span class="small">${esc(r.origin)}</span><div class="small">${esc(A(r.why))}</div></div>`).join(""));
  if ((c.recv || []).length) parts.push(`<h4>stances received (turn ${c.t + 1})</h4>` + c.recv.map(r => `<div class="cit">${seatChip(r.from)} ${kchip(r.stance)} ${esc(A(r.why))} <div class="small">as paraphrased: “${esc(A(r.para))}” · match ${r.match}</div></div>`).join(""));
  parts.push(`</details>`);
  return parts.join("");
}
function receptionTable(i){
  const r = i.reception || {};
  if (!Object.keys(r).length) return `<div class="small">${i.t === turns[turns.length - 1] ? "Last turn: no later stances." : D.has_stances ? "No stances resolved onto this idea." : "This run has no stance data."}</div>`;
  return `<table><tr><th>seat</th><th>verdict</th><th>stances</th></tr>${seatOrder.filter(s => r[s]).map(s => {
    const x = r[s]; const det = Object.entries(x).filter(([k]) => k !== "verdict").map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", ");
    return `<tr><td>${seatChip(s)}</td><td>${kchip(x.verdict === "needs_other_evidence" ? "needs" : x.verdict, x.verdict.replace(/_/g, " "))}</td><td class="small">${esc(det)}</td></tr>`; }).join("")}</table>`;
}
function edgeRow(e, other){
  const parts = []; ["agree","disagree","needs","withdraw"].forEach(k => { if (e[k]) parts.push(`${e[k]} ${k}`); });
  return `<div class="cit"><a data-edge="${e.id}">${kchip(e.kind, KNAME[e.kind].split(" (")[0])}</a> ${ilink(other)} <span class="small">${parts.join(", ")}${parts.length ? " · " : ""}sim ${e.sim}</span></div>`;
}
function showIdea(id){
  const i = ideaById[id]; if (!i) return;
  const ups = D.edges.filter(e => e.dst === id), dns = D.edges.filter(e => e.src === id);
  const flags = [];
  if (i.withdrawn_frac > 0) flags.push(`⊘ ${(i.withdrawn_frac * 100).toFixed(0)}% of its claims later withdrawn by their authors`);
  if (i.is_revision) flags.push("↺ self-revision of an earlier position");
  if (i.n_disagree > 0) flags.push(`⚡ contradicted by ${i.n_disagree} stance(s)`);
  if (i.merge) flags.push("⋈ merges ideas from several themes");
  if (i.split) flags.push("⋔ splits into several themes next turn");
  const mem = i.members.map(m => claimById[m]).filter(Boolean);
  panel.innerHTML = `<div class="small">Turn ${i.t} · <span class="chip" style="background:hsl(${hue(i.theme)},62%,90%)">${esc(themeLabel(i.theme))}</span></div>
    <h2>${esc(A(i.topic || i.title))}</h2>
    ${i.topic ? `${i.gist ? `<div class="gist">${esc(A(i.gist))}</div>` : ""}<div class="small cq">central claim: “${esc(A(i.title))}”</div>` : ""}
    <div class="meta">${esc(i.id)} · ${i.n_claims} claims · ${i.n_docs} refs · strength ${(i.strength * 100).toFixed(0)}% · grounded ${(i.grounded_frac * 100).toFixed(0)}%</div>
    <div style="margin:6px 0">${i.authors.map(seatChip).join("")}</div>
    ${flags.length ? `<div class="small">${flags.map(esc).join("<br>")}</div>` : ""}
    <h4>reception in turn ${i.t + 1} (bar borders)</h4>${receptionTable(i)}
    <h4>upstream (${ups.length})</h4>${ups.map(e => edgeRow(e, e.src)).join("") || '<div class="small">root idea — no earlier parent</div>'}
    <h4>downstream (${dns.length})</h4>${dns.map(e => edgeRow(e, e.dst)).join("") || '<div class="small">no later descendant</div>'}
    <h4>claims (${mem.length})</h4>${mem.map(c => claimCard(c, c.id === i.medoid)).join("")}`;
  bindPanel();
}
function showEdge(e){
  const a = ideaById[e.src], b = ideaById[e.dst];
  panel.innerHTML = `<div class="small">edge ${esc(e.id)} · turn ${a.t} → ${b.t}</div><h2>${kchip(e.kind, KNAME[e.kind])}</h2>
    <div class="cit"><b>from</b> ${ilink(e.src)}</div><div class="cit"><b>to</b> ${ilink(e.dst)}</div>
    <div class="meta">idea similarity ${e.sim}${e.cont ? " · also a semantic continuation" : ""}</div>
    ${(e.withdrawals || []).length ? `<h4>withdrawals (${e.withdrawals.length})</h4>` + e.withdrawals.map(w => `<div class="cit">${clink(w.by)} withdraws ${clink(w.of)}<div class="small">${esc(A((claimById[w.by] || {}).text || "").slice(0, 400))}</div></div>`).join("") : ""}
    ${(e.stances || []).length ? `<h4>stances (${e.stances.length})</h4>` + e.stances.map(s => `<div class="cit">${seatChip(s.from)} ${kchip(s.stance)} on ${clink(s.on)} → carried in ${clink(s.via)}<div>${esc(A(s.why))}</div><div class="small">paraphrase: “${esc(A(s.para))}” · match ${s.match}</div></div>`).join("") : ""}
    ${!e.stances.length && !(e.withdrawals || []).length ? '<div class="small">No declared stance: this edge is inferred from semantic similarity between the two ideas (drawn dotted).</div>' : ""}`;
  bindPanel();
}
function showTurn(t){
  const ti = turnInfo[t] || {}, m = ti.metrics || {};
  const ab = (D.abstentions || []).filter(a => a.t === t);
  const byTheme = {}; D.ideas.filter(i => i.t === t).forEach(i => byTheme[i.theme] = (byTheme[i.theme] || 0) + i.n_claims);
  const metr = Object.entries(m).filter(([k, v]) => v != null && k !== "turn").map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${typeof v === "number" ? (+v.toFixed(3)) : esc(v)}</td></tr>`).join("");
  panel.innerHTML = `<h2>Turn ${t}</h2><div class="meta">${ti.n_claims || "?"} claims · ${ab.length} abstentions</div>
    <h4>moderator question</h4><pre>${esc(A(ti.question || "(not recorded)"))}</pre>
    ${metr ? `<h4>run metrics</h4><table>${metr}</table>` : ""}
    <h4>claims by theme</h4>${Object.entries(byTheme).sort((a, b) => b[1] - a[1]).map(([th, n]) => `<div class="cit"><span class="chip" style="background:hsl(${hue(+th)},62%,88%)">${esc(themeLabel(+th))}</span> ${n}</div>`).join("")}
    <h4>abstentions (${ab.length})</h4>${ab.map(a => `<div class="cit">${seatChip(a.seat)} ${kchip("oos", (a.cause || "").replace(/_/g, " "))} <b>${esc(A(a.part))}</b><div class="small">${esc(A(a.detail))}</div></div>`).join("") || '<div class="small">none</div>'}`;
  bindPanel();
}
function showSeat(s){
  const si = SI[s] || {};
  const mine = D.claims.filter(c => c.seat === s);
  const given = {}; D.claims.forEach(c => (c.recv || []).forEach(r => { if (r.from === s) given[r.stance] = (given[r.stance] || 0) + 1; }));
  const got = {}; mine.forEach(c => (c.recv || []).forEach(r => got[r.stance] = (got[r.stance] || 0) + 1));
  const ab = (D.abstentions || []).filter(a => a.seat === s);
  const wd = mine.filter(c => c.is_withdrawal);
  panel.innerHTML = `<h2>${seatChip(s)} ${esc(S.codes ? si.code : si.name)}</h2><div class="meta">${esc(si.kind || "")} seat · ${mine.length} claims · ${wd.length} withdrawals · ${ab.length} abstentions</div>
    <h4>claims per turn</h4>${turns.map(t => `<div class="cit">Turn ${t}: ${mine.filter(c => c.t === t).length} claims in ${new Set(mine.filter(c => c.t === t).map(c => c.idea)).size} ideas</div>`).join("")}
    <h4>stances given</h4>${Object.entries(given).map(([k, v]) => kchip(k, `${k.replace(/_/g, " ")} ${v}`)).join(" ") || '<span class="small">none</span>'}
    <h4>stances received</h4>${Object.entries(got).map(([k, v]) => kchip(k, `${k.replace(/_/g, " ")} ${v}`)).join(" ") || '<span class="small">none</span>'}
    <h4>withdrawals (${wd.length})</h4>${wd.map(c => `<div class="cit">${clink(c.id)}${c.withdraws ? " ⊘ " + clink(c.withdraws) : ""}<div class="small">${esc(A(c.text).slice(0, 300))}</div></div>`).join("") || '<div class="small">none</div>'}
    <h4>ideas authored</h4>${D.ideas.filter(i => i.authors.includes(s)).map(i => `<div class="cit">T${i.t} ${ilink(i.id)}</div>`).join("")}
    <h4>abstentions</h4>${ab.map(a => `<div class="cit">T${a.t} ${kchip("oos", (a.cause || "").replace(/_/g, " "))} ${esc(A(a.part))}</div>`).join("") || '<div class="small">none</div>'}`;
  bindPanel();
}
function showOverview(){
  const st = D.stats || {};
  panel.innerHTML = `<h2>${esc(D.label)}${D.subtitle ? " — " + esc(D.subtitle) : ""}</h2>
    <div class="meta">${D.seats.length} seats · ${turns.length} turns · ${st.claims} claims → ${D.ideas.length} ideas in ${D.themes.length} themes · ${D.edges.length} links<br>
    ${st.stances || 0} stances (${st.stances_resolved || 0} resolved to a target claim) · ${st.withdrawals || 0} withdrawals · ${st.abstentions || 0} abstentions</div>
    ${D.has_stances ? "" : `<div class="small" style="background:#fff7e0;border:1px solid #f0d58a;border-radius:6px;padding:6px 8px;margin:8px 0">This run was recorded with an earlier harness that stored <b>no stances</b>. Every link is a <i>continuation</i> inferred from semantic similarity, so support/contradiction colours and seat-bar borders are absent. Withdrawals are still detected from claim text.</div>`}
    <h4>how to read</h4>
    <div class="small" style="color:#374151">
    <p>${O === "tb" ? "<b>Rows</b> are turns (top → bottom); the <b>top row</b> holds the seats" : "<b>Columns</b> are turns (left → right); the <b>first column</b> holds the seats"}, the roots of the flow. Turn-1 ideas hang off the seats that voiced them. Switch <i>layout</i> in the header to change orientation.</p>
    <p><b>Nodes</b> are <i>ideas</i>: clusters of near-identical claims made in the same turn. Fill and left stripe = <b>theme</b> (similar themes have similar hues, and sit side by side). The title is the most central claim.</p>
    <p><b>Bars</b> along the bottom: one per seat, fixed order (same as the seat row). <b>Filled</b> = that seat voiced the idea. <b>Border</b> = that seat's stance on it in the next turn: <span style="color:${VCOL.agree}">green support</span>, <span style="color:${VCOL.disagree}">red contradiction</span>, <span style="color:${VCOL.mixed}">purple mixed</span>, <span style="color:${VCOL.needs_other_evidence}">amber needs other evidence</span>, <b>black</b> out of scope, thin grey = no stance.</p>
    <p><b>Edges</b> run from an idea to where it was taken up next turn, coloured by the dominant stance; width ∝ number of stances. Dotted grey = inferred only from semantic similarity (no declared stance). Dashed black = a seat withdrew its earlier claim.</p>
    <p><b>Bold</b> ideas are strongly held (many seats, supported, not withdrawn); <b>pale</b> ones are weak or withdrawn (dashed border). Glyphs: ⊘ withdrawn · ↺ self-revision · ⚡ contradicted · ⋈ merge · ⋔ split.</p>
    <p><b>Hover</b> an idea to trace its whole lineage (upstream + downstream); <b>click</b> to pin it and open its evidence. Hover/click a seat to see its trajectory; click a turn label for the moderator question and abstentions. Scroll to zoom, drag to pan.</p></div>
    <h4>embedding backend</h4><div class="small">${esc(D.backend)}${D.run_dir ? " · " + esc(D.run_dir) : ""}</div>`;
  bindPanel();
}
function bindPanel(){
  panel.querySelectorAll("a[data-idea]").forEach(a => a.addEventListener("click", () => selectIdea(a.dataset.idea, true)));
  panel.querySelectorAll("a[data-edge]").forEach(a => a.addEventListener("click", () => { const e = D.edges.find(x => x.id === a.dataset.edge);
    S.pinned = {type: "edge", id: e.id}; if (!VIS.includes(e)){ S.kinds[e.kind] = 1; render(); buildLeft(); } applyHighlight(); showEdge(e); }));
  panel.scrollTop = 0;
}
function selectIdea(id, center){ document.body.classList.remove("nopanel"); S.pinned = {type: "idea", id}; applyHighlight(); showIdea(id); if (center) centerOn(ideaById[id], 0.6); }

// ---------- left sidebar: themes (mini theme-river), seats, legend / edge filters
function buildLeft(){
  const maxN = Math.max(...D.themes.map(th => Math.max(...turns.map(t => D.ideas.filter(i => i.t === t && i.theme === th.id).reduce((s, i) => s + i.n_claims, 0)))), 1);
  const spark = th => { const bw = 8; return `<svg class="spark" width="${turns.length * bw}" height="16">${turns.map((t, k) => {
    const n = D.ideas.filter(i => i.t === t && i.theme === th.id).reduce((s, i) => s + i.n_claims, 0); const h = n ? 2 + 14 * n / maxN : 0;
    return `<rect x="${k * bw}" y="${16 - h}" width="${bw - 1.5}" height="${h}" fill="hsl(${th.hue},55%,52%)"><title>turn ${t}: ${n} claims</title></rect>`; }).join("")}</svg>`; };
  const themes = [...D.themes].sort((a, b) => a.hue - b.hue);
  const lg = Object.keys(KCOL).map(k => `<label class="row" style="cursor:pointer"><input type="checkbox" data-kind="${k}" ${S.kinds[k] ? "checked" : ""}><span class="legend-line" style="border-color:${KCOL[k]};border-top-style:${k === "withdraw" ? "dashed" : k === "cont" ? "dotted" : "solid"}"></span><span class="lbl">${KNAME[k]}</span><span class="small">${D.edges.filter(e => e.kind === k).length}</span></label>`).join("");
  $("left").innerHTML = `<h3>themes <span class="small" style="text-transform:none">(claims per turn)</span></h3>
    ${themes.map(th => `<div class="row${S.theme === th.id ? " on" : ""}" data-theme="${th.id}" title="${esc(A(th.exemplar))}"><span class="sw" style="background:hsl(${th.hue},60%,55%)"></span><span class="lbl">${esc(A(th.label))}</span>${spark(th)}</div>`).join("")}
    <h3>seats</h3>
    ${seatOrder.map(s => `<div class="row${S.seat === s ? " on" : ""}" data-seat="${esc(s)}"><span class="sw" style="background:${seatCol(s)};border-radius:${(SI[s] || {}).kind === "discipline" ? 2 : 6}px"></span><span class="lbl">${esc(seatName(s))}</span><span class="small">${D.claims.filter(c => c.seat === s).length}</span></div>`).join("")}
    <h3>edges (filter)</h3>${lg}
    <h3>seat bars</h3>
    <div class="small"><span class="bar-demo" style="background:#1f77b4;border-color:#c9ced6"></span>voiced the idea<br>
    <span class="bar-demo" style="background:#fff;border-color:${VCOL.agree}"></span>next-turn support<br>
    <span class="bar-demo" style="background:#fff;border-color:${VCOL.disagree}"></span>next-turn contradiction<br>
    <span class="bar-demo" style="background:#fff;border-color:${VCOL.mixed}"></span>mixed &nbsp;<span class="bar-demo" style="background:#fff;border-color:${VCOL.needs_other_evidence}"></span>needs evidence<br>
    <span class="bar-demo" style="background:#fff;border-color:#333"></span>out of scope &nbsp;<span class="bar-demo" style="background:#fff;border:1px solid #c9ced6"></span>no stance</div>
    <h3>glyphs</h3><div class="small">⊘ withdrawn · ↺ self-revision · ⚡ contradicted · ⋈ merge · ⋔ split<br>dashed border = mostly withdrawn</div>`;
  $("left").querySelectorAll("[data-theme]").forEach(r => r.addEventListener("click", () => { const th = +r.dataset.theme; S.theme = S.theme === th ? null : th; S.pinned = null; buildLeft(); applyHighlight(); }));
  $("left").querySelectorAll("[data-seat]").forEach(r => r.addEventListener("click", () => { const s = r.dataset.seat; S.seat = S.seat === s ? null : s; S.pinned = null; buildLeft(); applyHighlight(); if (S.seat) showSeat(s); }));
  $("left").querySelectorAll("[data-kind]").forEach(c => c.addEventListener("change", () => { S.kinds[c.dataset.kind] = c.checked ? 1 : 0; render(); }));
}

// ---------- header controls
$("ttl").textContent = D.label + " — panel idea flow";
$("sub").textContent = D.subtitle || "";
$("codes").addEventListener("change", e => { S.codes = e.target.checked; render(); buildLeft(); refreshPanel(); });
$("strength").addEventListener("change", e => { S.strength = e.target.checked; render(); });
$("topics").addEventListener("change", e => { S.topics = e.target.checked; render(); });
if (!D.ideas.some(i => i.topic)) $("topicsLbl").style.display = "none";
$("roots").addEventListener("change", e => { S.roots = e.target.checked; render(); });
$("minw").addEventListener("input", e => { S.minw = +e.target.value; $("minwv").textContent = S.minw; render(); });
$("spot").addEventListener("change", e => { S.spot = e.target.value; S.pinned = null; applyHighlight(); });
let qT; $("q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); S.pinned = null; applyHighlight(); }, 180); });
$("fit").addEventListener("click", () => fit(false));
$("orient").value = O;
$("orient").addEventListener("change", e => { O = e.target.value; history.replaceState(null, "", "#" + O); computeSeatOrder(); buildLeft(); drawMini(); render(); refreshPanel(); fit(O === "lr"); });
$("fith").addEventListener("click", () => fit(true));
$("svgdl").addEventListener("click", () => {
  const clone = svg.cloneNode(true); clone.setAttribute("viewBox", `0 0 ${G().width} ${G().height}`); clone.setAttribute("width", G().width); clone.setAttribute("height", G().height);
  clone.querySelector("#vp").removeAttribute("transform");
  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  style.textContent = ".ttl{font:11px/13.5px system-ui,sans-serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.dim{opacity:.1}.edge.dim,.root.dim{opacity:.03}.hit{stroke:transparent;fill:none}";
  clone.insertBefore(style, clone.firstChild);
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type: "image/svg+xml"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (D.label || "panel") + "_flow.svg"; a.click();
});
function refreshPanel(){
  const p = S.pinned;
  if (!p) return showOverview();
  if (p.type === "idea") showIdea(p.id); else if (p.type === "edge") showEdge(D.edges.find(x => x.id === p.id)); else if (p.type === "seat") showSeat(p.id);
}
window.addEventListener("resize", positionTurnLabels);
$("tgl-left").addEventListener("click", () => { document.body.classList.toggle("noleft"); fit(false); });
$("tgl-panel").addEventListener("click", () => { document.body.classList.toggle("nopanel"); fit(false); });
if (innerWidth < 1100) document.body.classList.add("noleft");
if (innerWidth < 760) document.body.classList.add("nopanel");

buildLeft();
drawMini();
render();
showOverview();
fit(O === "lr");
})();
</script>
</body>
</html>
